<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>达人邮件追踪大盘 — 雨过天青</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* ================= 1. 方案 A：雨过天青·淡玉宣纸底色 ================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #F4F7F5; /* 柔和浅玉灰，消灭刺眼日光灯感 */
      color: #24332C;      /* 松烟墨色 */
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* 顶栏：素雅留白 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(36, 51, 44, 0.08);
    }
    .brand-title {
      font-family: 'Noto Serif SC', serif; /* 温润的新中式宋体细节，绝不张扬 */
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #19241F;
    }
    .user-info {
      font-size: 13px;
      color: #617369;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-download {
      padding: 7px 18px;
      border-radius: 999px;
      background: #2D6A4F; /* 远山松青 */
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(45, 106, 79, 0.18);
      transition: 0.2s;
    }
    .btn-download:hover { background: #24553F; }

    /* 筛选器：无生硬边框的极简竹笺标签 */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .filter-pill {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(36, 51, 44, 0.08);
      color: #617369;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .filter-pill.active {
      background: #FFFFFF;
      color: #19241F;
      border-color: rgba(45, 106, 79, 0.3);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      font-weight: 600;
    }

    /* 核心指标卡：温润白玉镇纸质感 */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }
    .metric-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 28px 32px;
      border: 1px solid rgba(36, 51, 44, 0.06);
      box-shadow: 0 10px 30px rgba(36, 51, 44, 0.03); /* 极轻的漫反射阴影 */
    }
    .metric-name {
      font-size: 13px;
      color: #72847A;
      margin-bottom: 12px;
      font-weight: 500;
    }
    .metric-val {
      font-size: 38px;
      font-weight: 700;
      color: #19241F;
      letter-spacing: -0.02em;
    }
    .val-bamboo { color: #2D6A4F; } /* 竹青色：真人打开 */
    .val-celadon { color: #1E5F74; } /* 晴水蓝：打开率 */

    /* 列表过渡预览区域 */
    .table-card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 24px 32px;
      border: 1px solid rgba(36, 51, 44, 0.06);
      box-shadow: 0 10px 30px rgba(36, 51, 44, 0.03);
    }
    .table-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 16px;
      font-weight: 600;
      color: #19241F;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(36, 51, 44, 0.06);
      margin-bottom: 12px;
    }
    .preview-tip {
      font-size: 14px;
      color: #8A9A90;
      padding: 20px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand-title">达人邮件追踪大盘</div>
      <div class="user-info">
        <a href="/api/download_extension" class="btn-download">下载插件</a>
        <span>yanxinc07@gmail.com</span>
      </div>
    </header>

    <div class="filter-bar">
      <div class="filter-pill active">全部</div>
      <div class="filter-pill">今天</div>
      <div class="filter-pill">昨天</div>
      <div class="filter-pill">7天</div>
      <div class="filter-pill">30天</div>
    </div>

    <div class="metrics-row">
      <div class="metric-card">
        <div class="metric-name">总发信量</div>
        <div class="metric-val">179</div>
      </div>
      <div class="metric-card">
        <div class="metric-name">真人有效打开数</div>
        <div class="metric-val val-bamboo">79</div>
      </div>
      <div class="metric-card">
        <div class="metric-name">真实打开率</div>
        <div class="metric-val val-celadon">44.1%</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-title">发信明细预览</div>
      <div class="preview-tip">（第 1 步先看：这个淡玉底色和顶部卡片在你的屏幕上看着是否舒服、温和）</div>
    </div>
  </div>

</body>
</html>
