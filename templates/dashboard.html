<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>邮件追踪大盘 — MailTracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F3F6F4;
      color: #202D26;
      padding: 36px 24px;
    }
    .container { max-width: 1060px; margin: 0 auto; }
    .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .nav-btn {
      text-decoration: none; padding: 7px 16px; border-radius: 999px; font-size: 13px;
      background: #FFFFFF; border: 1px solid rgba(36, 51, 44, 0.1); color: #5E7267; margin-left: 8px;
    }
    .nav-btn.active { background: #2D6A4F; color: #FFF; border-color: #2D6A4F; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #FFF; border-radius: 14px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.02); }
    .stat-num { font-size: 28px; font-weight: 700; color: #2D6A4F; margin-top: 6px; }
    .table-card { background: #FFF; border-radius: 16px; padding: 24px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 12px; border-bottom: 1px solid #EAEFEA; color: #5E7267; }
    td { padding: 12px; border-bottom: 1px solid #F3F6F4; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-read { background: #E8F5E9; color: #2E7D32; }
    .badge-unread { background: #ECEFF1; color: #78909C; }
  </style>
  <script>
    const SUPABASE_URL = "https://hteqhquorjycjdxburun.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yVVewqmlY0RGqNX87n_j_Q_oT47OEzK";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadDashboardData() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        window.location.href = "/";
        return;
      }
      const { data: emails, error } = await client.from("emails").select("*").eq("user_id", session.user.id).order("send_time", { ascending: false });
      if (error) { console.error("load emails failed:", error); }

      const total = emails ? emails.length : 0;
      const read = emails ? emails.filter(e => (e.open_count || 0) > 0).length : 0;
      const rate = total > 0 ? ((read / total) * 100).toFixed(1) + "%" : "0%";

      document.getElementById("statTotal").innerText = total;
      document.getElementById("statRead").innerText = read;
      document.getElementById("statRate").innerText = rate;

      const tbody = document.getElementById("emailTableBody");
      tbody.innerHTML = "";
      if (emails) {
        emails.forEach(e => {
          const tr = document.createElement("tr");
          let statusHtml;
          if (e.status === "failed") {
            const errTxt = String(e.error || "").slice(0, 300).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            statusHtml = '<span class="badge badge-unread">发送失败</span>' + (errTxt ? `<div style="color:#C62828; font-size:12px; margin-top:4px; max-width:360px; white-space:normal; word-break:break-all;">${errTxt}</div>` : "");
          } else if ((e.open_count || 0) > 0) {
            statusHtml = `<span class="badge badge-read">已读 ×${e.open_count}</span>`;
          } else {
            statusHtml = '<span class="badge badge-unread">未开信</span>';
          }
          const fmt = v => { if (!v) return "-"; const d = new Date(v); return isNaN(d) ? v : d.toLocaleString(); };
          tr.innerHTML = `
            <td>${e.recipient || "-"}</td>
            <td>${e.subject || "-"}</td>
            <td>${statusHtml}</td>
            <td>${fmt(e.first_open_time)}</td>
            <td>${fmt(e.send_time)}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    }
    window.addEventListener("DOMContentLoaded", loadDashboardData);
  </script>
</head>
<body>
  <div class="container">
    <div class="header-box">
      <h2>📊 邮件追踪大盘</h2>
      <div>
        <a href="/" class="nav-btn">🌊 官网首页</a>
        <a href="/dashboard" class="nav-btn active">📊 邮件追踪大盘</a>
        <a href="/outreach" class="nav-btn">🚀 批量触达</a>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div>累计发送数</div><div class="stat-num" id="statTotal">0</div></div>
      <div class="stat-card"><div>已读邮件数</div><div class="stat-num" id="statRead">0</div></div>
      <div class="stat-card"><div>整体开信率</div><div class="stat-num" id="statRate">0%</div></div>
    </div>
    <div class="table-card">
      <table>
        <thead><tr><th>收件人</th><th>邮件主题</th><th>状态</th><th>首开时间</th><th>发送时间</th></tr></thead>
        <tbody id="emailTableBody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
