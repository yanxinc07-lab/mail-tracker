<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>达人邮件追踪大盘 — 雨过天青</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= 1. 雨过天青·淡玉宣纸底色与圆润无杠零 ================= */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #F4F7F5; /* 柔和浅玉灰，告别刺眼日光灯感 */
            color: #24332C;      /* 松烟墨色 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", 'Plus Jakarta Sans', Roboto, "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
            font-variant-numeric: normal; /* 彻底禁用斜杠零 */
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 28px 80px;
        }

        /* 顶栏：素雅留白 */
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(36, 51, 44, 0.08);
        }
        .header {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: #19241F;
        }
        .user-info {
            font-size: 13px;
            color: #617369;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .download-btn {
            padding: 7px 18px;
            border-radius: 999px;
            background: #2D6A4F; /* 远山松青 */
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.15);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .download-btn:hover { background: #24553F; }
        .logout-btn {
            background: none;
            border: 1px solid rgba(36, 51, 44, 0.15);
            color: #72847A;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-btn:hover { color: #c0392b; border-color: #c0392b; }

        /* 筛选器 */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(36, 51, 44, 0.08);
            color: #617369;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #FFFFFF;
            color: #19241F;
            border-color: rgba(45, 106, 79, 0.35);
            box-shadow: 0 2px 8px rgba(36, 51, 44, 0.04);
            font-weight: 600;
        }
        .custom-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #72847A;
        }
        .custom-picker input[type="date"] {
            border: 1px solid rgba(36, 51, 44, 0.1);
            background: #FFFFFF;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            color: #24332C;
            font-family: inherit;
        }
        .custom-picker button {
            background: #2D6A4F;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* 核心指标卡：温润白玉质感 */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 36px;
        }
        .card {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid rgba(36, 51, 44, 0.06);
            box-shadow: 0 8px 24px rgba(36, 51, 44, 0.03);
        }
        .card-title {
            font-size: 13px;
            color: #72847A;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card-value {
            font-size: 36px;
            font-weight: 700;
            color: #19241F;
            letter-spacing: -0.02em;
            font-variant-numeric: normal;
        }

        /* 明细列表容器 */
        .table-container {
            background: #FFFFFF;
            border-radius: 18px;
            border: 1px solid rgba(36, 51, 44, 0.06);
            box-shadow: 0 10px 30px rgba(36, 51, 44, 0.03);
            overflow: hidden;
        }
        .table-title {
            padding: 20px 28px;
            font-family: 'Noto Serif SC', serif;
            font-size: 16px;
            font-weight: 600;
            color: #19241F;
            border-bottom: 1px solid rgba(36, 51, 44, 0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: #FAFBF9;
            color: #7C8D83;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            padding: 14px 28px;
            border-bottom: 1px solid rgba(36, 51, 44, 0.05);
        }
        td {
            padding: 18px 28px !important;
            border-bottom: 1px solid rgba(36, 51, 44, 0.04) !important;
            font-size: 14px;
            vertical-align: middle;
            transition: background 0.2s;
            font-variant-numeric: normal;
        }
        tr:last-child td { border-bottom: none !important; }
        tr:hover td { background: #FAFBF9; }

        /* 状态按钮与胶囊标签 */
        .status-btn {
            appearance: none;
            -webkit-appearance: none;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            border: 1px solid transparent;
            font-variant-numeric: normal;
            transition: 0.2s;
        }
        .badge-unread {
            background-color: #F1F4F2;
            color: #6E7E74;
            border-color: rgba(36, 51, 44, 0.06);
        }
        .badge-read {
            background-color: rgba(45, 106, 79, 0.08);
            color: #2D6A4F;
            border-color: rgba(45, 106, 79, 0.2);
            font-weight: 600;
        }
        .badge-scan {
            background-color: rgba(234, 179, 8, 0.08);
            color: #92400e;
            border-color: rgba(234, 179, 8, 0.2);
            font-weight: 600;
        }

        .menu-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-item:hover {
            background: #F4F7F5;
        }

        /* 登录弹窗居中素雅化 */
        #authOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(36, 51, 44, 0.2);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #FFFFFF;
            width: 360px;
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px rgba(36, 51, 44, 0.08);
            text-align: center;
            border: 1px solid rgba(36, 51, 44, 0.06);
        }
        .auth-card h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            color: #19241F;
            margin-bottom: 6px;
        }
        .auth-card p {
            font-size: 13px;
            color: #72847A;
            margin-bottom: 24px;
        }
        .auth-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(36, 51, 44, 0.12);
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
        }
        .auth-input:focus { border-color: #2D6A4F; }
        .auth-btn {
            width: 100%;
            padding: 11px 0;
            background: #2D6A4F;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-toggle {
            font-size: 12px;
            color: #72847A;
            margin-top: 16px;
        }
        .auth-toggle a {
            color: #2D6A4F;
            cursor: pointer;
            font-weight: 600;
            margin-left: 4px;
        }
        .ext-download-box { margin-top: 20px; }

        @media (max-width: 860px) {
            .cards { grid-template-columns: 1fr; }
            .container { padding: 24px 16px; }
            th, td { padding: 14px 16px !important; }
        }
    </style>

    <script>
        const SUPABASE_URL = "https://hteqhquorjycjdxburun.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0ZXFocXVvcmp5Y2pkeGJ1cnVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MTY5MjUsImV4cCI6MjEwNTE5MjkyNX0.JzTkH-xoiExeSxHGu420PgVfUNV_Jp_zZoJQn3yqY2g";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let currentTimeRange = "all";
        let isRegisterMode = false;

        async function checkAuth() {
            const { data: { session } } = await client.auth.getSession();
            if (session && session.user) {
                currentUser = session.user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('userEmailText').innerText = currentUser.email;
                loadData();
            } else {
                currentUser = null;
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('mainContainer').style.display = 'none';
            }
        }

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? '注册新账号' : '登录系统';
            document.getElementById('authBtn').innerText = isRegisterMode ? '立即注册' : '登 录';
            document.getElementById('modeText').innerText = isRegisterMode ? '已有账号？' : '还没有账号？';
            document.getElementById('modeBtn').innerText = isRegisterMode ? '去登录' : '立即注册';
            document.getElementById('authMsg').innerText = '';
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const msgEl = document.getElementById('authMsg');
            if (!email || !password) {
                msgEl.style.color = '#ef4444';
                msgEl.innerText = '请填写邮箱和密码';
                return;
            }
            msgEl.style.color = '#2563eb';
            msgEl.innerText = isRegisterMode ? '正在注册...' : '正在登录...';

            if (isRegisterMode) {
                const { data, error } = await client.auth.signUp({ email, password });
                if (error) {
                    msgEl.style.color = '#ef4444';
                    msgEl.innerText = error.message;
                } else {
                    msgEl.style.color = '#16a34a';
                    msgEl.innerText = '注册成功！正在进入...';
                    setTimeout(checkAuth, 1000);
                }
            } else {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.style.color = '#ef4444';
                    msgEl.innerText = '登录失败: ' + error.message;
                } else {
                    checkAuth();
                }
            }
        }

        async function handleLogout() {
            await client.auth.signOut();
            window.location.reload();
        }

        async function loadData(customStart = "", customEnd = "") {
            if (!currentUser) return;
            let url = `/api/dashboard_data?user_id=${currentUser.id}&time_range=${currentTimeRange}`;
            if (customStart && customEnd) {
                url += `&custom_start=${customStart}&custom_end=${customEnd}`;
            }

            const res = await fetch(url);
            const data = await res.json();

            document.getElementById('statTotalSent').innerText = data.total_sent;
            document.getElementById('statTotalOpened').innerText = data.total_opened;
            document.getElementById('statRate').innerText = data.rate;

            const tbody = document.getElementById('tableBody');
            if (!data.rows || data.rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 40px; color: #8A9A90;">暂无发信记录</td></tr>';
                return;
            }

            let html = '';
            for (let r of data.rows) {
                const emailId = r.id;
                const itemLogs = data.logs_map[emailId] || [];
                const logCount = itemLogs.length > 0 ? itemLogs.length : (r.open_count || 0);

                let badgeClass = 'badge-unread';
                if (r.status === '已读') badgeClass = 'badge-read';
                else if (r.status === '误扫') badgeClass = 'badge-scan';

                let timelineItems = '';
                itemLogs.forEach((l, idx) => {
                    const tag = l.is_scanner ? '<span style="color:#d97706; font-size:11px; margin-left:4px;">(系统扫)</span>' : '';
                    timelineItems += `
                    <div id="log-row-${l.log_id}" style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; font-size:12px; border-bottom:1px dashed rgba(36,51,44,0.08);">
                        <span>#${idx+1} ${l.open_time}${tag}</span>
                        <a href="javascript:void(0)" onclick="deleteLog(${l.log_id}, '${emailId}')" style="color:#ef4444; text-decoration:none; margin-left:12px; font-size:11px;">删除</a>
                    </div>`;
                });

                let timelineHtml = '';
                if (logCount > 0) {
                    timelineHtml = `
                    <span id="log-count-btn-${emailId}" style="font-size:11px; color:#2D6A4F; cursor:pointer; margin-left:6px; user-select:none; font-weight:600;" onclick="toggleLogs(event, '${emailId}')">
                        (共${logCount}次 ▾)
                    </span>
                    <div id="logs-${emailId}" class="popup-panel" style="display:none; position:absolute; z-index:100; background:#fff; border:1px solid rgba(36,51,44,0.08); border-radius:12px; box-shadow:0 12px 30px rgba(36,51,44,0.08); padding:14px 16px; width:290px; margin-top:6px;">
                        <div style="font-weight:600; font-size:12px; margin-bottom:8px; color:#19241F; border-bottom:1px solid rgba(36,51,44,0.06); padding-bottom:6px;">打开时间轴流水</div>
                        <div id="log-list-${emailId}">
                            ${timelineItems || '<div style="font-size:12px; color:#8A9A90;">暂无流水明细</div>'}
                        </div>
                    </div>`;
                }

                const subj = r.subject || '无主题';
                const recipient = (r.recipient && r.recipient !== '-') ? `<div style="font-size: 13px; color: #7A8C81; margin-top: 4px; font-weight: normal;">👤 ${r.recipient}</div>` : '';

                html += `
                <tr>
                    <td style="color: #19241F; font-weight: 600;">
                        <div>${subj}</div>
                        ${recipient}
                    </td>
                    <td style="color: #7A8C81; font-size: 13px;">${r.send_time}</td>
                    <td>
                        <div style="position:relative; display:inline-block;">
                            <button id="btn-${emailId}" onclick="toggleMenu(event, '${emailId}')" class="status-btn ${badgeClass}">
                                <span id="txt-${emailId}">${r.status} (${logCount}次)</span> ▾
                            </button>
                            <div id="menu-${emailId}" class="popup-panel menu-box" style="display:none; position:absolute; z-index:100; left:0; margin-top:6px; background:#fff; border:1px solid rgba(36,51,44,0.08); border-radius:10px; box-shadow:0 10px 24px rgba(36,51,44,0.08); width:110px; overflow:hidden;">
                                <div class="menu-item" onclick="setStatus(event, '${emailId}', '已读', ${logCount})" style="color:#2D6A4F;">标为已读</div>
                                <div class="menu-item" onclick="setStatus(event, '${emailId}', '误扫', ${logCount})" style="color:#92400e; border-top:1px solid rgba(36,51,44,0.05);">标为误扫</div>
                                <div class="menu-item" onclick="setStatus(event, '${emailId}', '未读', ${logCount})" style="color:#6E7E74; border-top:1px solid rgba(36,51,44,0.05);">标为未读</div>
                            </div>
                        </div>
                    </td>
                    <td style="color: #7A8C81; font-size: 13px; position:relative;">
                        <span id="first-time-${emailId}">${r.first_open_time}</span>${timelineHtml}
                    </td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        function switchTab(range) {
            currentTimeRange = range;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === range);
            });
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            loadData();
        }

        function applyCustomDate() {
            const start = document.getElementById('startDate').value;
            const end = document.getElementById('endDate').value;
            if (!start || !end) {
                alert("请选择起止日期");
                return;
            }
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            loadData(start, end);
        }

        window.addEventListener('DOMContentLoaded', checkAuth);

        document.addEventListener('click', function() {
            document.querySelectorAll('.popup-panel').forEach(p => p.style.display = 'none');
        });

        function toggleMenu(e, id) {
            e.stopPropagation();
            const menu = document.getElementById('menu-' + id);
            const isShown = menu.style.display === 'block';
            document.querySelectorAll('.popup-panel').forEach(p => p.style.display = 'none');
            menu.style.display = isShown ? 'none' : 'block';
        }

        function toggleLogs(e, id) {
            e.stopPropagation();
            const panel = document.getElementById('logs-' + id);
            const isShown = panel.style.display === 'block';
            document.querySelectorAll('.popup-panel').forEach(p => p.style.display = 'none');
            panel.style.display = isShown ? 'none' : 'block';
        }

        function setStatus(e, id, newStatus, count) {
            e.stopPropagation();
            document.getElementById('menu-' + id).style.display = 'none';

            const btn = document.getElementById('btn-' + id);
            const txt = document.getElementById('txt-' + id);
            txt.innerText = `${newStatus} (${count}次)`;

            let cls = 'status-btn ';
            if (newStatus === '已读') cls += 'badge-read';
            else if (newStatus === '误扫') cls += 'badge-scan';
            else cls += 'badge-unread';
            btn.className = cls;

            fetch('/api/update_status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, status: newStatus })
            });
        }

        function deleteLog(logId, emailId) {
            if (!confirm("确定删除这条打开记录吗？")) return;
            
            fetch('/api/logs/' + logId, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok') {
                        const row = document.getElementById('log-row-' + logId);
                        if (row) row.remove();

                        const txt = document.getElementById('txt-' + emailId);
                        if (txt) {
                            const curStatus = txt.innerText.split(' ')[0];
                            txt.innerText = `${curStatus} (${data.new_count}次)`;
                        }

                        const ft = document.getElementById('first-time-' + emailId);
                        if (ft) ft.innerText = data.new_first_time;
                        
                        const countBtn = document.getElementById('log-count-btn-' + emailId);
                        if (countBtn) {
                            if (data.new_count > 0) {
                                countBtn.innerText = `(共${data.new_count}次 ▾)`;
                            } else {
                                countBtn.style.display = 'none';
                            }
                        }
                    }
                });
        }
    </script>
</head>
<body class="dashboard-body">
    <div id="authOverlay" style="display:none;">
        <div class="auth-card">
            <h2 id="authTitle">登录系统</h2>
            <p>达人邮件追踪商业看板</p>
            <input type="email" id="authEmail" class="auth-input" placeholder="请输入你的邮箱地址" />
            <input type="password" id="authPassword" class="auth-input" placeholder="请输入密码 (至少6位)" />
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">登 录</button>
            <div id="authMsg" style="margin-top:10px; font-size:12px;"></div>
            <div class="auth-toggle">
                <span id="modeText">还没有账号？</span>
                <a id="modeBtn" onclick="toggleMode()">立即注册</a>
            </div>
            <div class="ext-download-box">
                <a href="/api/download_extension" class="download-btn" style="width:100%; justify-content:center; box-sizing:border-box; padding:10px 0;">
                    📥 下载 Chrome / Edge 插件
                </a>
            </div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <div class="header-box">
            <div class="header">达人邮件追踪大盘</div>
            <div class="user-info">
                <a href="/api/download_extension" class="download-btn">📥 下载插件包</a>
                <span>当前账号: <b id="userEmailText" style="color: #19241F;">-</b></span>
                <button class="logout-btn" onclick="handleLogout()">退出</button>
            </div>
        </div>
        <div class="nav-bar">
            <div class="tabs">
                <button class="tab-btn active" data-range="all" onclick="switchTab('all')">全部</button>
                <button class="tab-btn" data-range="today" onclick="switchTab('today')">今天</button>
                <button class="tab-btn" data-range="yesterday" onclick="switchTab('yesterday')">昨天</button>
                <button class="tab-btn" data-range="week" onclick="switchTab('week')">7天</button>
                <button class="tab-btn" data-range="month" onclick="switchTab('month')">30天</button>
                <button class="tab-btn" data-range="quarter" onclick="switchTab('quarter')">90天</button>
            </div>
            <div class="custom-picker">
                <input type="date" id="startDate">
                <span>至</span>
                <input type="date" id="endDate">
                <button onclick="applyCustomDate()">筛选历史</button>
            </div>
        </div>
        <div class="cards">
            <div class="card">
                <div class="card-title">总发信量</div>
