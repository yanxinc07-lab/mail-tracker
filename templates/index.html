<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MailTracker — Closer to the Ocean</title>
  <!-- 引入顶级高级衬线体与无衬线体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      color: #14233c; /* 提取自右图的顶级深黛青墨色 */
    }

    /* 1. 全屏纯净原画视频背景（0 遮罩，全透光） */
    .video-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }
    .video-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom; /* 突出海平线 */
    }

    /* 2. 页面全局容器 */
    .viewport {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0 48px 40px;
      position: relative;
      z-index: 10;
    }

    /* 3. 顶部微光小提示条（与右图一致） */
    .top-announcement {
      text-align: center;
      padding: 10px 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(20, 35, 60, 0.7);
      text-transform: uppercase;
      font-weight: 500;
    }

    /* 4. 极简通透导航栏 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #11223f;
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-link {
      text-decoration: none;
      color: rgba(20, 35, 60, 0.75);
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #0a192f; }
    .btn-nav-capsule {
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid rgba(20, 35, 60, 0.25);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #11223f;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn-nav-capsule:hover {
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(20, 35, 60, 0.4);
    }

    /* 5. 核心 Hero 区域：精准复制右图的杂志级左侧构图 */
    .hero-section {
      max-width: 620px;
      padding-top: 80px;
      margin-left: 10px;
    }
    .hero-eyebrow {
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(20, 35, 60, 0.7);
      margin-bottom: 24px;
      font-weight: 600;
    }
    .hero-title {
      font-family: 'Playfair Display', serif; /* 优雅杂志衬线大标 */
      font-size: clamp(56px, 6.5vw, 84px);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #11223f;
      margin-bottom: 24px;
    }
    .hero-desc {
      font-size: 16px;
      line-height: 1.6;
      color: rgba(20, 35, 60, 0.75);
      margin-bottom: 36px;
      max-width: 440px;
      font-weight: 400;
    }

    /* 6. 按钮组：深海墨蓝胶囊 + 晶莹玻璃悬浮按钮 */
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-dark-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 28px;
      border-radius: 999px;
      background: #12233f;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(18, 35, 63, 0.25);
      transition: all 0.2s ease;
    }
    .btn-dark-pill:hover {
      background: #0a172c;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(18, 35, 63, 0.35);
    }
    .btn-play-glass {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #11223f;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-play-glass:hover {
      background: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
    }
    .play-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #11223f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 7. 右下角向下滚动提示 */
    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
    }
    .scroll-hint {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(20, 35, 60, 0.6);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .viewport { padding: 0 20px 30px; }
      .nav-links { display: none; }
      .hero-title { font-size: 46px; }
      .hero-section { padding-top: 50px; }
    }
  </style>
</head>
<body>

  <!-- 1. 全屏高清纯净海洋视频（无遮罩） -->
  <div class="video-bg-container">
    <video autoplay loop muted playsinline class="video-bg">
      <source src="/static/ocean.mp4" type="video/mp4">
    </video>
  </div>

  <div class="viewport">
    <div>
      <div class="top-announcement">A new perspective begins here · 开启邮件洞察新视野</div>
      <header>
        <a class="brand" href="/">
          <span>≈ OCEAN TRACKER</span>
        </a>
        <div class="nav-links">
          <a href="#" class="nav-link">功能特性</a>
          <a href="#" class="nav-link">达人建联</a>
          <a href="#" class="nav-link">声呐防扫</a>
        </div>
        <a href="/dashboard" class="btn-nav-capsule">进入控制台 →</a>
      </header>

      <!-- 核心杂志大标区 -->
      <div class="hero-section">
        <div class="hero-eyebrow">FEEL THE WORLD SLOW DOWN · 让每一步有迹可循</div>
        <h1 class="hero-title">Closer to<br>the ocean.</h1>
        <p class="hero-desc">无感嵌入 Gmail 商务发信。毫秒级捕获大洋彼岸的真实开信信号，在波涛之下洞见商机。</p>
        <div class="hero-actions">
          <a href="/api/download_extension" class="btn-dark-pill">
            获取 Chrome 插件 →
          </a>
          <a href="/dashboard" class="btn-play-glass">
            <span class="play-icon">▶</span>
            <span>查看数据大盘</span>
          </a>
        </div>
      </div>
    </div>

    <!-- 底部滚动提示 -->
    <div class="bottom-bar">
      <div class="scroll-hint">
        SCROLL TO EXPLORE ↓
      </div>
    </div>
  </div>

</body>
</html>
