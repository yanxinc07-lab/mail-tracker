<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MailTracker — 看见每封邮件的下一步</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      width: 100%;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      background: #020b19;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* 1. 纯净全屏视频背景 (彻底去掉死黑遮罩) */
    .video-bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }
    .video-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
    }
    .ambient-glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(30, 144, 255, 0.15) 0%, rgba(2, 11, 25, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* 2. 现代磨砂玻璃导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 48px;
      z-index: 100;
      background: rgba(2, 11, 25, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 198, 255, 0.45);
    }
    .logo-text {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #FFFFFF 0%, #B0C8E8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-nav-outline {
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #E2E8F0;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    .btn-nav-outline:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-nav-solid {
      padding: 8px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00A3FF 0%, #0057FF 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.35);
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-nav-solid:hover {
      box-shadow: 0 6px 22px rgba(0, 122, 255, 0.55);
      transform: translateY(-1px);
    }
    .btn-nav-outreach {
      background: linear-gradient(135deg, #2D6A4F 0%, #1E4D38 100%);
      box-shadow: 0 4px 16px rgba(45, 106, 79, 0.35);
    }
    .btn-nav-outreach:hover {
      box-shadow: 0 6px 22px rgba(45, 106, 79, 0.55);
    }

    /* 3. Hero 区域 */
    .hero-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 130px 24px 80px;
      text-align: center;
    }
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      background: rgba(0, 198, 255, 0.08);
      border: 1px solid rgba(0, 198, 255, 0.25);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #70D6FF;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }
    .hero-title {
      font-size: 58px;
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: -0.035em;
      margin-bottom: 22px;
      max-width: 860px;
      background: linear-gradient(180deg, #FFFFFF 20%, #A2C4E9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 24px rgba(0, 114, 255, 0.22);
    }
    .hero-subtitle {
      font-size: 16px;
      line-height: 1.65;
      color: #9AB3CE;
      max-width: 620px;
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* 双入口核心按钮组 */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .btn-hero-primary {
      padding: 13px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #00A3FF 0%, #0066FF 100%);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 26px rgba(0, 102, 255, 0.45);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .btn-hero-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 34px rgba(0, 102, 255, 0.65);
    }
    .btn-hero-outreach {
      background: linear-gradient(135deg, #2D6A4F 0%, #1E4D38 100%);
      box-shadow: 0 8px 26px rgba(45, 106, 79, 0.4);
      border-color: rgba(162, 201, 187, 0.3);
    }
    .btn-hero-outreach:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 34px rgba(45, 106, 79, 0.6);
    }
    .btn-hero-secondary {
      padding: 13px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #E2E8F0;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-hero-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .scroll-hint {
      margin-top: 50px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 768px) {
      .navbar { padding: 0 20px; }
      .hero-title { font-size: 38px; }
      .hero-subtitle { font-size: 14px; }
      .hero-actions { flex-direction: column; width: 100%; }
      .btn-hero-primary, .btn-hero-outreach, .btn-hero-secondary { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- 视频背景 -->
  <div class="video-bg-container">
    <video class="video-bg" autoplay loop muted playsinline>
      <source src="/static/bg.mp4" type="video/mp4">
    </video>
  </div>
  <div class="ambient-glow"></div>

  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="logo-box">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      <span class="logo-text">MailTracker</span>
    </div>
    <div class="nav-actions">
      <a href="/api/download_extension" class="btn-nav-outline">📥 下载插件</a>
      <a href="/dashboard" class="btn-nav-solid">📊 追踪大盘</a>
      <a href="/outreach" class="btn-nav-solid btn-nav-outreach">🚀 批量触达</a>
    </div>
  </nav>

  <!-- 中间 Hero 区域 -->
  <section class="hero-section">
    <div class="hero-pill">
      ✦ SIGNALS BENEATH THE SURFACE · 洞察水面之下
    </div>
    <h1 class="hero-title">每一封邮件，都有迹可循。</h1>
    <p class="hero-subtitle">
      专为跨境电商与达人营销打造的 Gmail 自动化与追踪工作台。<br>
      30 秒声呐过滤误扫，捕获大洋彼岸的真实开信契机。
    </p>
    
    <!-- 核心入口：双子星按钮平铺 -->
    <div class="hero-actions">
      <a href="/api/download_extension" class="btn-hero-secondary">
        ☁️ 获取 Chrome 插件
      </a>
      <a href="/dashboard" class="btn-hero-primary">
        📊 进入追踪大盘 →
      </a>
      <a href="/outreach" class="btn-hero-primary btn-hero-outreach">
        🚀 发起批量触达 →
      </a>
    </div>

    <div class="scroll-hint">
      <span>SCROLL TO EXPLORE</span>
      <span>↓</span>
    </div>
  </section>
</body>
</html>
