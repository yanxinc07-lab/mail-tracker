<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MailTracker — 极简邮件触达与开信追踪</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F3F6F4;
      color: #202D26;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(36, 51, 44, 0.05);
      border: 1px solid rgba(36, 51, 44, 0.08);
      text-align: center;
    }
    h1 { font-size: 24px; color: #17221C; margin-bottom: 8px; }
    p { font-size: 13px; color: #5E7267; margin-bottom: 24px; }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid rgba(36, 51, 44, 0.15);
      font-size: 14px;
      outline: none;
    }
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #2D6A4F;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #245841; }
  </style>
  <script>
    const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        alert("登录失败: " + error.message);
      } else {
        window.location.href = "/dashboard";
      }
    }
  </script>
</head>
<body>
  <div class="auth-card">
    <h1>MailTracker</h1>
    <p>高交付率达人批量触达 & 实时已读追踪大盘</p>
    <input type="email" id="email" class="form-input" placeholder="输入工作邮箱" />
    <input type="password" id="password" class="form-input" placeholder="输入登录密码" />
    <button class="btn-primary" onclick="handleLogin()">进入工作台</button>
  </div>
</body>
</html>
