    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100%;
            min-height: 100vh;
            background-color: #F3F6F4;
            color: #202D26;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", 'Plus Jakarta Sans', Roboto, sans-serif;
            padding: 40px 24px;
        }
        .container {
            max-width: 1100px;

        }

        }

            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #64756B;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(36, 51, 44, 0.08);
            transition: 0.2s;
        }
        .nav-btn:hover { color: #17221C; background: #FFFFFF; }
        .nav-btn.active {
            background: #2D6A4F;
            color: #FFFFFF;
            border-color: #2D6A4F;
        }
        .card {
            background: #FFFFFF;
            border-radius: 18px;
            padding: 36px;
            border: 1px solid rgba(36, 51, 44, 0.06);
            box-shadow: 0 8px 24px rgba(36, 51, 44, 0.03);
